name: dogfood

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit the repo's own Growth OS
        run: pnpm growthos doctor . --strict
      - name: Regenerate the cockpit
        run: pnpm growthos cockpit --root . --no-open
      - name: Collect public repo metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p growth/metrics
          date=$(date +%F)
          stars=$(gh api "repos/${{ github.repository }}" --jq '.stargazers_count')
          forks=$(gh api "repos/${{ github.repository }}" --jq '.forks_count')
          printf '{"date":"%s","stars":%s,"forks":%s,"source":"github-api"}\n' "$date" "$stars" "$forks" \
            > "growth/metrics/${date}-github.json"
      - name: Upload cockpit
        uses: actions/upload-artifact@v4
        with:
          name: cockpit
          path: growth/cockpit/
      - name: Commit metrics
        run: |
          git config user.name "growthos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add growth/metrics growth/cockpit
          git diff --cached --quiet || git commit -m "chore(dogfood): weekly metrics and cockpit"
          git push
