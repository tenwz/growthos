name: Share your Growth OS Score
description: Run growthOS on a real repo and post the score, including what failed.
title: "score: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        This is the proof loop. A score with no repo behind it is not useful. Share the failing checks too — those are the interesting part.

        Do not paste private customer quotes. Redact names, emails, and anything under NDA.

  - type: input
    id: score
    attributes:
      label: Score and tier
      placeholder: "72/100 (Operator)"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command and the summary output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: failed
    attributes:
      label: Which checks failed, and why
      description: The honest part. Copy the audit output, redacted.
      render: text
    validations:
      required: true

  - type: textarea
    id: learned
    attributes:
      label: What you changed because of it
      description: One change is enough. "Nothing yet" is a valid answer.
    validations:
      required: false

  - type: input
    id: repo
    attributes:
      label: Public repo or site (optional)
      description: Only if you want it linked. An anonymized description is fine.
    validations:
      required: false
